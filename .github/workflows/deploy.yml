name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  AR_REPO: career-planner
  SERVICE: career-planner
  SCRAPER_SERVICE: scraper-demo
  SCRAPER_IMAGE: unclecode/crawl4ai:latest
  SEARCH_SERVICE: search-demo

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SCRAPER_BACKEND: ${{ secrets.SCRAPER_BACKEND }}
      SEARCH_BACKEND: ${{ secrets.SEARCH_BACKEND }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync GitHub Secrets to Secret Manager
        # Only credentials live in Secret Manager; non-sensitive config is
        # passed as plain env vars in the deploy step. A version is added only
        # when the value changed, and older versions are destroyed since every
        # binding uses :latest (each active version is billed monthly).
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail

          prune_old_versions() {
            local name="$1"
            gcloud secrets versions list "$name" --project="$PROJECT_ID" \
              --filter="state!=DESTROYED" --sort-by=~createTime --format='value(name.basename())' \
              | tail -n +2 \
              | xargs -r -I{} gcloud secrets versions destroy {} --secret="$name" --project="$PROJECT_ID" --quiet
          }

          upsert_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "skip $name (empty)"
              return
            fi
            if ! gcloud secrets describe "$name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project="$PROJECT_ID" --replication-policy=automatic
            fi
            local current
            current=$(gcloud secrets versions access latest --secret="$name" --project="$PROJECT_ID" 2>/dev/null || true)
            if [ "$current" = "$value" ]; then
              echo "unchanged $name"
            else
              printf '%s' "$value" | gcloud secrets versions add "$name" --project="$PROJECT_ID" --data-file=-
            fi
            prune_old_versions "$name"
          }

          upsert_secret cp-llm-base-url               "$LLM_BASE_URL"
          upsert_secret cp-llm-api-key                "$LLM_API_KEY"
          upsert_secret cp-google-oauth-client-secret "$GOOGLE_OAUTH_CLIENT_SECRET"
          upsert_secret cp-scraper-api-key            "$SCRAPER_API_KEY"
          upsert_secret cp-brave-api-key              "$BRAVE_API_KEY"
          upsert_secret cp-basic-auth-password        "$BASIC_AUTH_PASSWORD"

      - name: Deploy Crawl4AI scraper to Cloud Run (optional)
        # Only deploys the scraper service when SCRAPER_BACKEND is set to
        # "crawl4ai" and SCRAPER_BASE_URL is either empty (we'll fill it in
        # from the deployed URL) or points at a scraper-demo.run.app URL.
        # If you're pointing at Firecrawl hosted or an external instance,
        # this step is a no-op.
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        if: ${{ env.SCRAPER_BACKEND == 'crawl4ai' }}
        run: |
          set -euo pipefail
          # Copy upstream image into our Artifact Registry so Cloud Run can
          # deploy it (Cloud Run doesn't pull directly from Docker Hub).
          UPSTREAM="${SCRAPER_IMAGE}"
          MIRROR="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/scraper:latest"
          docker pull "$UPSTREAM"
          docker tag  "$UPSTREAM" "$MIRROR"
          docker push "$MIRROR"

          # Crawl4AI ≥ 0.9.0 enforces its own API token via Authorization: Bearer.
          # We ALSO require Cloud Run IAM invocation: the main service's Go
          # scrape client sends a Google ID token in X-Serverless-Authorization
          # (Cloud Run's escape-hatch header for cases where Authorization is
          # already in use). Both layers gate independently.
          gcloud run deploy "$SCRAPER_SERVICE" \
            --image "$MIRROR" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --port 11235 \
            --cpu 2 \
            --cpu-boost \
            --memory 2Gi \
            --concurrency 4 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account "cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="CRAWL4AI_API_TOKEN=cp-scraper-api-key:latest"

          # Grant the main service's runtime SA permission to invoke the
          # scraper. Idempotent — re-binding a role is a no-op.
          gcloud run services add-iam-policy-binding "$SCRAPER_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --member="serviceAccount:cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role=roles/run.invoker

          # Hand the just-deployed URL to the main service deploy unless the
          # operator pinned SCRAPER_BASE_URL in GitHub Secrets.
          if [ -z "${{ secrets.SCRAPER_BASE_URL }}" ]; then
            SCRAPER_URL=$(gcloud run services describe "$SCRAPER_SERVICE" \
              --project "$PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')
            echo "AUTO_SCRAPER_BASE_URL=$SCRAPER_URL" >> "$GITHUB_ENV"
          fi

      - name: Deploy SearXNG to Cloud Run (optional)
        # Runs only when SEARCH_BACKEND=searxng. Otherwise the main service
        # can still point SEARCH_BASE_URL at an external instance.
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          HAS_BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY != '' }}
        if: ${{ env.SEARCH_BACKEND == 'searxng' }}
        run: |
          set -euo pipefail

          IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/searxng:${{ github.event.workflow_run.head_sha || github.sha }}"
          docker build -t "$IMAGE" deploy/searxng
          docker push "$IMAGE"

          # IAM-gated (only cp-runtime can invoke); the main service attaches
          # the ID token via metadata. Brave key is optional — when unset,
          # remove any prior binding so SearXNG boots without it (brave
          # engine fails but others keep working).
          if [ "$HAS_BRAVE_API_KEY" = "true" ]; then
            SEARCH_SET_SECRETS_ARG=(--set-secrets="BRAVE_API_KEY=cp-brave-api-key:latest")
          else
            SEARCH_SET_SECRETS_ARG=(--remove-secrets="BRAVE_API_KEY")
          fi
          gcloud run deploy "$SEARCH_SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --cpu-boost \
            --memory 512Mi \
            --concurrency 8 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account "cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            "${SEARCH_SET_SECRETS_ARG[@]}"

          gcloud run services add-iam-policy-binding "$SEARCH_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --member="serviceAccount:cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role=roles/run.invoker

          # Hand the just-deployed URL to the main service deploy unless the
          # operator pinned SEARCH_BASE_URL in GitHub Secrets.
          if [ -z "${{ secrets.SEARCH_BASE_URL }}" ]; then
            SEARCH_URL=$(gcloud run services describe "$SEARCH_SERVICE" \
              --project "$PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')
            echo "AUTO_SEARCH_BASE_URL=$SEARCH_URL" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PINNED_SCRAPER_BASE_URL: ${{ secrets.SCRAPER_BASE_URL }}
          PINNED_SEARCH_BASE_URL: ${{ secrets.SEARCH_BASE_URL }}
          HAS_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL != '' }}
          HAS_LLM_API_KEY: ${{ secrets.LLM_API_KEY != '' }}
          HAS_OAUTH_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET != '' }}
          HAS_SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY != '' }}
          HAS_BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD != '' }}
        run: |
          set -euo pipefail

          # Non-sensitive config as plain env vars; empty values are omitted.
          # A JSON file (valid YAML) avoids gcloud's comma-splitting of values.
          SCRAPER_BASE_URL="${PINNED_SCRAPER_BASE_URL:-${AUTO_SCRAPER_BASE_URL:-}}"
          SEARCH_BASE_URL="${PINNED_SEARCH_BASE_URL:-${AUTO_SEARCH_BASE_URL:-}}"
          ENV_FILE="$RUNNER_TEMP/cloud-run-env.json"
          jq -n \
            --arg LLM_PROVIDER "$LLM_PROVIDER" \
            --arg LLM_MODEL "$LLM_MODEL" \
            --arg GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID" \
            --arg SCRAPER_BACKEND "$SCRAPER_BACKEND" \
            --arg SCRAPER_BASE_URL "$SCRAPER_BASE_URL" \
            --arg SEARCH_BACKEND "$SEARCH_BACKEND" \
            --arg SEARCH_BASE_URL "$SEARCH_BASE_URL" \
            '$ARGS.named | with_entries(select(.value != ""))' > "$ENV_FILE"

          ENV_ARG=(--clear-env-vars)
          if [ "$(jq 'length' "$ENV_FILE")" -gt 0 ]; then
            ENV_ARG=(--env-vars-file="$ENV_FILE")
          fi

          # Only bind secrets that were actually populated in GitHub Secrets.
          # Missing LLM_* is fine — the server boots BYOK-only in that case
          # (see internal/app/app.go newLLMClient). Referencing a non-existent
          # Secret Manager entry would make the revision fail to start.
          SECRETS=""
          append_secret() {
            if [ -n "$SECRETS" ]; then SECRETS+=","; fi
            SECRETS+="$1"
          }
          [ "$HAS_LLM_BASE_URL" = "true" ] && append_secret "LLM_BASE_URL=cp-llm-base-url:latest"
          [ "$HAS_LLM_API_KEY"  = "true" ] && append_secret "LLM_API_KEY=cp-llm-api-key:latest"
          [ "$HAS_OAUTH_SECRET" = "true" ] && append_secret "GOOGLE_OAUTH_CLIENT_SECRET=cp-google-oauth-client-secret:latest"
          [ "$HAS_SCRAPER_API_KEY" = "true" ] && append_secret "SCRAPER_API_KEY=cp-scraper-api-key:latest"
          [ "$HAS_BASIC_AUTH_PASSWORD" = "true" ] && append_secret "BASIC_AUTH_PASSWORD=cp-basic-auth-password:latest"

          # --set-secrets/--clear-secrets replace every prior secret binding,
          # so names that moved to plain env vars don't collide.
          SET_SECRETS_ARG=(--clear-secrets)
          if [ -n "$SECRETS" ]; then
            SET_SECRETS_ARG=(--set-secrets="$SECRETS")
          fi

          gcloud run deploy "$SERVICE" \
            --image "${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${{ github.event.workflow_run.head_sha || github.sha }}" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --cpu-boost \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --service-account "cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            "${ENV_ARG[@]}" \
            "${SET_SECRETS_ARG[@]}"

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --project "${{ secrets.GCP_PROJECT_ID }}" --region "$GCP_REGION" --format='value(status.url)'

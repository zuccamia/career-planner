name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  AR_REPO: career-planner
  SERVICE: career-planner
  SCRAPER_SERVICE: scraper-demo
  SCRAPER_IMAGE: unclecode/crawl4ai:latest

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SCRAPER_BACKEND: ${{ secrets.SCRAPER_BACKEND }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync GitHub Secrets to Secret Manager
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SCRAPER_BACKEND: ${{ secrets.SCRAPER_BACKEND }}
          SCRAPER_BASE_URL: ${{ secrets.SCRAPER_BASE_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          set -euo pipefail

          upsert_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "skip $name (empty)"
              return
            fi
            if ! gcloud secrets describe "$name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project="$PROJECT_ID" --replication-policy=automatic
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" --project="$PROJECT_ID" --data-file=-
          }

          upsert_secret cp-llm-provider              "$LLM_PROVIDER"
          upsert_secret cp-llm-model                 "$LLM_MODEL"
          upsert_secret cp-llm-base-url              "$LLM_BASE_URL"
          upsert_secret cp-llm-api-key               "$LLM_API_KEY"
          upsert_secret cp-google-oauth-client-id     "$GOOGLE_OAUTH_CLIENT_ID"
          upsert_secret cp-google-oauth-client-secret "$GOOGLE_OAUTH_CLIENT_SECRET"
          upsert_secret cp-scraper-backend            "$SCRAPER_BACKEND"
          upsert_secret cp-scraper-base-url           "$SCRAPER_BASE_URL"
          upsert_secret cp-scraper-api-key            "$SCRAPER_API_KEY"

      - name: Deploy Crawl4AI scraper to Cloud Run (optional)
        # Only deploys the scraper service when SCRAPER_BACKEND is set to
        # "crawl4ai" and SCRAPER_BASE_URL is either empty (we'll fill it in
        # from the deployed URL) or points at a scraper-demo.run.app URL.
        # If you're pointing at Firecrawl hosted or an external instance,
        # this step is a no-op.
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        if: ${{ env.SCRAPER_BACKEND == 'crawl4ai' }}
        run: |
          set -euo pipefail
          # Copy upstream image into our Artifact Registry so Cloud Run can
          # deploy it (Cloud Run doesn't pull directly from Docker Hub).
          UPSTREAM="${SCRAPER_IMAGE}"
          MIRROR="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/scraper:latest"
          docker pull "$UPSTREAM"
          docker tag  "$UPSTREAM" "$MIRROR"
          docker push "$MIRROR"

          # Crawl4AI ≥ 0.9.0 enforces its own API token. Reuse the same
          # cp-scraper-api-key we bind on the main service so both sides
          # see the same token and Authorization: Bearer works end-to-end.
          gcloud run deploy "$SCRAPER_SERVICE" \
            --image "$MIRROR" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --port 11235 \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 4 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account "cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="CRAWL4AI_API_TOKEN=cp-scraper-api-key:latest"

          # Grant the main service's runtime SA permission to invoke the
          # scraper. Idempotent — re-binding a role is a no-op.
          gcloud run services add-iam-policy-binding "$SCRAPER_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --member="serviceAccount:cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role=roles/run.invoker

          # Auto-fill cp-scraper-base-url with the just-deployed URL so the
          # main service can find it. If the operator set SCRAPER_BASE_URL
          # in GitHub Secrets to a non-Cloud-Run URL, they can leave that
          # secret populated to override.
          if [ -z "${{ secrets.SCRAPER_BASE_URL }}" ]; then
            SCRAPER_URL=$(gcloud run services describe "$SCRAPER_SERVICE" \
              --project "$PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')
            # The sync step above skips creating cp-scraper-base-url when the
            # GH secret is empty — which is the intended path here. Create it
            # if missing so `versions add` doesn't 404 on the first deploy.
            if ! gcloud secrets describe cp-scraper-base-url --project="$PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create cp-scraper-base-url --project="$PROJECT_ID" --replication-policy=automatic
            fi
            printf '%s' "$SCRAPER_URL" | gcloud secrets versions add cp-scraper-base-url \
              --project="$PROJECT_ID" --data-file=-
          fi

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          HAS_LLM_PROVIDER: ${{ secrets.LLM_PROVIDER != '' }}
          HAS_LLM_MODEL: ${{ secrets.LLM_MODEL != '' }}
          HAS_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL != '' }}
          HAS_LLM_API_KEY: ${{ secrets.LLM_API_KEY != '' }}
          HAS_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' }}
          HAS_OAUTH_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET != '' }}
          HAS_SCRAPER_BACKEND: ${{ secrets.SCRAPER_BACKEND != '' }}
          HAS_SCRAPER_BASE_URL: ${{ secrets.SCRAPER_BASE_URL != '' }}
          HAS_SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY != '' }}
          # If we auto-populated cp-scraper-base-url from the scraper-demo
          # deployment above, also bind that env var so the main service can
          # reach it. Otherwise SCRAPER_BASE_URL is only bound when GitHub
          # secrets provided a value.
          AUTO_POPULATED_SCRAPER_URL: ${{ secrets.SCRAPER_BACKEND == 'crawl4ai' && secrets.SCRAPER_BASE_URL == '' }}
        run: |
          set -euo pipefail

          # Only bind secrets that were actually populated in GitHub Secrets.
          # Missing LLM_* is fine — the server boots BYOK-only in that case
          # (see internal/app/app.go newLLMClient). Referencing a non-existent
          # Secret Manager entry would make the revision fail to start.
          SECRETS=""
          append_secret() {
            if [ -n "$SECRETS" ]; then SECRETS+=","; fi
            SECRETS+="$1"
          }
          [ "$HAS_LLM_PROVIDER" = "true" ] && append_secret "LLM_PROVIDER=cp-llm-provider:latest"
          [ "$HAS_LLM_MODEL"    = "true" ] && append_secret "LLM_MODEL=cp-llm-model:latest"
          [ "$HAS_LLM_BASE_URL" = "true" ] && append_secret "LLM_BASE_URL=cp-llm-base-url:latest"
          [ "$HAS_LLM_API_KEY"  = "true" ] && append_secret "LLM_API_KEY=cp-llm-api-key:latest"
          [ "$HAS_OAUTH_ID"     = "true" ] && append_secret "GOOGLE_OAUTH_CLIENT_ID=cp-google-oauth-client-id:latest"
          [ "$HAS_OAUTH_SECRET" = "true" ] && append_secret "GOOGLE_OAUTH_CLIENT_SECRET=cp-google-oauth-client-secret:latest"
          [ "$HAS_SCRAPER_BACKEND" = "true" ]                                    && append_secret "SCRAPER_BACKEND=cp-scraper-backend:latest"
          { [ "$HAS_SCRAPER_BASE_URL" = "true" ] || [ "$AUTO_POPULATED_SCRAPER_URL" = "true" ]; } && append_secret "SCRAPER_BASE_URL=cp-scraper-base-url:latest"
          [ "$HAS_SCRAPER_API_KEY" = "true" ]                                    && append_secret "SCRAPER_API_KEY=cp-scraper-api-key:latest"

          SET_SECRETS_ARG=()
          if [ -n "$SECRETS" ]; then
            SET_SECRETS_ARG=(--set-secrets="$SECRETS")
          fi

          gcloud run deploy "$SERVICE" \
            --image "${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${{ github.event.workflow_run.head_sha || github.sha }}" \
            --project "$PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --service-account "cp-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            "${SET_SECRETS_ARG[@]}"

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --project "${{ secrets.GCP_PROJECT_ID }}" --region "$GCP_REGION" --format='value(status.url)'
